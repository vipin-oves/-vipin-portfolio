<!-- src/app/app.component.html -->
<div class="app-shell noise-bg">
  <app-navbar></app-navbar>
  <main>
    <app-hero></app-hero>
    <app-about></app-about>
    <app-skills></app-skills>
    <app-projects></app-projects>
    <app-certifications></app-certifications>
    <app-resume></app-resume>
    <app-links></app-links>
    <app-contact></app-contact>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-logo">
          <span class="mono accent">&lt;</span>
          <span class="footer-name">Vipin Kumar Yadav</span>
          <span class="mono accent">/&gt;</span>
        </div>
        <p class="footer-copy">
          Built with <span class="accent">Angular 17</span> &amp; passion for clean architecture.
          <span class="dot-sep"></span>
          {{ currentYear }}
        </p>
        <div class="footer-links">
          <a href="https://github.com/vipinkumaryadav" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="https://linkedin.com/in/vipinkumaryadav-dev" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="mailto:vipin.yadav@email.com">Email</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scroll to top -->
  <button
    class="scroll-top-btn"
    [class.visible]="showScrollTop"
    (click)="scrollToTop()"
    aria-label="Scroll to top"
    title="Back to top"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>
</div>
